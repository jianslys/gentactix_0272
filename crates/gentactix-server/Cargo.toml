[package]
name = "gentactix-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
gentactix-core = { path = "../gentactix-core" }
png = "0.17"
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[[bin]]
name = "gentactix-server"
path = "src/main.rs"

[[bin]]
name = "bench_50k"
path = "src/bin/bench_50k.rs"
